spring:
  datasource:
    url: jdbc:h2:mem:technox_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-unit-tests-only-must-be-long-enough
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

logging:
  level:
    com.technox: DEBUG
